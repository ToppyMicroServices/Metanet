[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe_metanet"
version = "0.1.0"
description = "Safe MetaNet: test-time weight editing with adaptive scope expansion and rollback"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_metanet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
